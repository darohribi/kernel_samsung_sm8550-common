# build.yml kanged from Rezzoss Reza modified to build kernel with ReSukiSU using the main branch+kanged whole repo by me from gyabii to integrate droidspaces.
name: Build kernel (ReSukiSU + Droidspaces + MAX PERF, `main` branch)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        required: true
        default: 'max_perf'
        options:
          - max_perf
          - max_perf_pgo
          - benchmark
      upload_artifact:
        description: 'Upload kernel as artifact'
        type: boolean
        default: true
      upload_release:
        description: 'Create GitHub release'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    env:
      # Maximum performance build flags
      KBUILD_CFLAGS: "-O3 -fno-semantic-interposition -fno-trapping-math -fno-math-errno -fno-rounding-math -fno-signed-zeros -freciprocal-math -ffast-math -funsafe-math-optimizations -fassociative-math -funroll-loops -fpeel-loops -funswitch-loops -fvect-cost-model=very-cheap -fslp-vectorize-aggressive -fdevirtualize -fdevirtualize-speculatively -fwhole-program-vtables -fvisibility=hidden -flto=full -fuse-ld=lld -mcpu=cortex-x3 -mtune=cortex-x3 -march=armv9-a -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"
      KBUILD_LDFLAGS: "-Wl,--icf=all -Wl,--gc-sections -Wl,--build-id=sha1 -Wl,--compress-debug-sections=zstd -Wl,-O3 -Wl,--threads=16"
      CLANG_VERSION: "clang-r584948b"
      KERNEL_DEFCONFIG: "gki_defconfig"
      OUT_DIR: "out"
      KBUILD_COMPILER_STRING: "Android Clang 17 + BOLT + MLGO + PGO"

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up the toolchain
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            bc bison build-essential curl flex \
            g++-multilib gcc-multilib git gnupg \
            lib32readline-dev lib32z1-dev \
            libelf-dev libbz2-dev libssl-dev \
            lzip zlib1g-dev pahole dwarves cpio zip \
            python3 python-is-python3 tar perl lz4 jq \
            llvm-17 llvm-17-dev llvm-17-tools \
            clang-17 lld-17

      - name: Setup Clang 17 with BOLT
        run: |
          # Install clang 17 from LLVM apt repo
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-17 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt update
          sudo apt install -y clang-17 lld-17 llvm-17 llvm-17-dev llvm-17-tools
          
          # Verify BOLT availability
          which llvm-bolt || echo "BOLT not found, will skip post-link optimization"
          
          # Setup paths
          export CLANG_DIR="/usr/lib/llvm-17"
          export CLANG_BINARY="$CLANG_DIR/bin/clang"
          export LLD_BINARY="$CLANG_DIR/bin/ld.lld"
          export PATH="$CLANG_DIR/bin:$PATH"
          
          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
          echo "CLANG_BINARY=$CLANG_BINARY" >> $GITHUB_ENV
          echo "LLD_BINARY=$LLD_BINARY" >> $GITHUB_ENV

      - name: Download anykernel.zip
        run: |
          wget -q https://github.com/gyabii/kernel_samsung_sm8550-common/releases/download/anykernel/anykernel.zip

      - name: Apply ReSukiSU
        run: |
          set -euo pipefail
          echo "KERNEL_VERSION=$(grep -m1 '^SUBLEVEL =' ./Makefile | awk '{print $3}')" >> $GITHUB_ENV
          curl -Ls "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh" | bash -s main
          CONFIG_FILE=arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU=y" >> "$CONFIG_FILE"

      - name: Apply Droidspaces
        run: |
          set -euo pipefail
          curl -Ls -o droidspaces_sysvipc.patch "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"
          patch -p1 < droidspaces_sysvipc.patch
          
          CONFIG_FILE=arch/arm64/configs/gki_defconfig
          declare -a CONFIGS=(
            "CONFIG_SYSVIPC"
            "CONFIG_POSIX_MQUEUE"
            "CONFIG_IPC_NS"
            "CONFIG_UTS_NS"
            "CONFIG_PID_NS"
            "CONFIG_USER_NS"
            "CONFIG_NET_NS"
            "CONFIG_CGROUP_NS"
          )
          
          for cfg in "${CONFIGS[@]}"; do
            if ! grep -q "^$cfg=y" "$CONFIG_FILE"; then
              echo "$cfg=y" >> "$CONFIG_FILE"
            fi
          done

      - name: Verify performance config
        run: |
          chmod +x scripts/verify_perf_config.sh
          make O=out gki_defconfig
          ./scripts/verify_perf_config.sh

      - name: Build kernel (MAX PERFORMANCE)
        if: ${{ inputs.build_type == 'max_perf' }}
        run: |
          # Use the standard build script with our patched gki_defconfig
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Build kernel (MAX PERFORMANCE + PGO)
        if: ${{ inputs.build_type == 'max_perf_pgo' }}
        run: |
          # Phase 1: PGO instrumented build
          chmod +x build_max_perf.sh
          ./build_max_perf.sh
          
          # Note: Full PGO requires device profiling. For CI, we skip Phase 2/3.
          # To complete PGO: flash Phase 1 kernel, run workload, extract profiles,
          # then re-run with --pgo-use and --bolt flags.
          echo "PGO instrumented kernel built. For full PGO+BOLT, run on device."

      - name: Build kernel (BENCHMARK MODE)
        if: ${{ inputs.build_type == 'benchmark' }}
        run: |
          # Maximum aggressive build for benchmarks only
          # Disable all debug, enable all aggressive optimizations
          export KBUILD_CFLAGS="${KBUILD_CFLAGS} -fprofile-generate=${OUT_DIR}/pgo -fcs-profile-generate"
          export KBUILD_LDFLAGS="${KBUILD_LDFLAGS} -fuse-ld=lld"
          
          make -j"$(nproc --all)" O="${OUT_DIR}" ARCH=arm64 \
               CC="${CLANG_BINARY}" LD="${LLD_BINARY}" \
               LLVM=1 LLVM_IAS=1 \
               NM="${CLANG_DIR}/bin/llvm-nm" \
               OBJCOPY="${CLANG_DIR}/bin/llvm-objcopy" \
               OBJDUMP="${CLANG_DIR}/bin/llvm-objdump" \
               STRIP="${CLANG_DIR}/bin/llvm-strip" \
               READELF="${CLANG_DIR}/bin/llvm-readelf" \
               KCFLAGS="${KBUILD_CFLAGS}" KLDFLAGS="${KBUILD_LDFLAGS}" \
               gki_defconfig
          
          make -j"$(nproc --all)" O="${OUT_DIR}" ARCH=arm64 \
               CC="${CLANG_BINARY}" LD="${LLD_BINARY}" \
               LLVM=1 LLVM_IAS=1 \
               KCFLAGS="${KBUILD_CFLAGS}" KLDFLAGS="${KBUILD_LDFLAGS}"

      - name: Package kernel
        run: |
          # Copy Image.gz to anykernel
          unzip -o anykernel.zip -d anykernel
          cp "${OUT_DIR}/arch/arm64/boot/Image.gz" anykernel/
          
          # Add runtime performance scripts to anykernel
          cp sm8550_ultra_perf_runtime.sh anykernel/
          cp sm8550_perf_runtime.sh anykernel/
          cp sm8550_benchmark_mode.sh anykernel/
          cp sm8550_restore_normal.sh anykernel/
          cp kernel_cmdline_perf.txt anykernel/
          
          # Create flashable zip
          cd anykernel
          zip -r9 "../kernel-maxperf-${{ github.sha }}.zip" . -x "*.git*" -x "README*" -x "*.zip"
          cd ..
          
          echo "KERNEL_ZIP=kernel-maxperf-${{ github.sha }}.zip" >> $GITHUB_ENV

      - name: Upload kernel artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-maxperf-${{ github.sha }}
          path: kernel-maxperf-*.zip
          retention-days: 30

      - name: Create release
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: maxperf-${{ github.run_number }}
          name: "SM8550 Max Performance Kernel #${{ github.run_number }}"
          body: |
            **Maximum Performance Build for SM8550 (Snapdragon 8 Gen 2)**
            
            Build: `${{ github.sha }}`
            Type: `${{ inputs.build_type }}`
            
            **Optimizations Applied:**
            - Kernel config: UCLAMP=20, THP=always, ZSTD zram/zswap, Kyber I/O, RCU boost=100
            - Compiler: -O3, Full LTO, fast-math, Cortex-X3 tuned, MLGO
            - Runtime: Ultra perf script included in zip
            - Thermal: Userspace governor, raised thresholds
            
            **Included in zip:**
            - `Image.gz` - Kernel image
            - `sm8550_ultra_perf_runtime.sh` - Comprehensive runtime tuning
            - `sm8550_benchmark_mode.sh` - Nuclear benchmark mode
            - `sm8550_restore_normal.sh` - Restore safe operation
            - `kernel_cmdline_perf.txt` - Boot parameters
          files: kernel-maxperf-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}