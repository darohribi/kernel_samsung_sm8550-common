# SM8550 Max Performance Build (clean, safe flags)
# Uses the fixed sm8550_perf_defconfig (no boot-breakers, no -ffast-math).
# Builds with Clang 17 + Thin LTO + -O3 + the safe perf defconfig.
# ReSukiSU + Droidspaces are NOT integrated here - use resukisu-build-nosusfs.yml
# for that. This workflow is a clean baseline to verify the perf defconfig boots.

name: Build SM8550 Max Performance (safe defconfig)

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload kernel as artifact'
        type: boolean
        default: true
      upload_release:
        description: 'Create GitHub release'
        type: boolean
        default: false
      apply_resukisu:
        description: 'Apply ReSukiSU (root) patch'
        type: boolean
        default: false
      apply_droidspaces:
        description: 'Apply Droidspaces (namespace) patch'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      # SAFE perf flags: NO -ffast-math, NO -funsafe-math-optimizations,
      # NO -fno-math-errno (kernel rejects all of these).
      # These are the maximum-impact flags that do not break the kernel.
      KBUILD_CFLAGS: "-O3 -fno-semantic-interposition -funroll-loops -fpeel-loops -funswitch-loops -fvect-cost-model=very-cheap -fslp-vectorize-aggressive -fdevirtualize -fdevirtualize-speculatively -fwhole-program-vtables -fvisibility=hidden -flto=thin -fuse-ld=lld -mcpu=cortex-x3 -mtune=cortex-x3 -march=armv9-a -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"
      KBUILD_LDFLAGS: "-Wl,--icf=all -Wl,--gc-sections -Wl,--build-id=sha1 -Wl,--compress-debug-sections=zstd -Wl,-O3 -Wl,--threads=16 -fuse-ld=lld"
      KERNEL_DEFCONFIG: "sm8550_perf_defconfig"
      OUT_DIR: "out"

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up the toolchain
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            bc bison build-essential curl flex \
            g++-multilib gcc-multilib git gnupg \
            lib32readline-dev lib32z1-dev \
            libelf-dev libbz2-dev libssl-dev \
            lzip zlib1g-dev pahole dwarves cpio zip \
            python3 python-is-python3 tar perl lz4 jq

      - name: Setup Clang 17
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-17 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt update
          sudo apt install -y clang-17 lld-17 llvm-17 llvm-17-dev llvm-17-tools
          which llvm-bolt || echo "BOLT not found, will skip post-link optimization"
          export CLANG_DIR="/usr/lib/llvm-17"
          export PATH="$CLANG_DIR/bin:$PATH"
          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV
          clang-17 --version
          ld.lld-17 --version

      - name: Set up swap space (24GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Apply ReSukiSU
        if: ${{ inputs.apply_resukisu }}
        run: |
          set -euo pipefail
          echo "KERNEL_VERSION=$(grep -m1 '^SUBLEVEL =' ./Makefile | awk '{print $3}')" >> $GITHUB_ENV
          curl -Ls "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh" | bash -s main
          CONFIG_FILE="arch/arm64/configs/${KERNEL_DEFCONFIG}"
          echo "CONFIG_KSU=y" >> "$CONFIG_FILE"

      - name: Apply Droidspaces
        if: ${{ inputs.apply_droidspaces }}
        run: |
          set -euo pipefail
          curl -Ls -o droidspaces_sysvipc.patch "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"
          patch -p1 < droidspaces_sysvipc.patch
          CONFIG_FILE="arch/arm64/configs/${KERNEL_DEFCONFIG}"
          declare -a CONFIGS=(
            "CONFIG_SYSVIPC"
            "CONFIG_POSIX_MQUEUE"
            "CONFIG_IPC_NS"
            "CONFIG_UTS_NS"
            "CONFIG_PID_NS"
            "CONFIG_USER_NS"
            "CONFIG_NET_NS"
            "CONFIG_CGROUP_NS"
          )
          for cfg in "${CONFIGS[@]}"; do
            if ! grep -q "^$cfg=y" "$CONFIG_FILE"; then
              echo "$cfg=y" >> "$CONFIG_FILE"
            fi
          done

      - name: Validate performance defconfig
        run: |
          set -e
          CONFIG_FILE="arch/arm64/configs/${KERNEL_DEFCONFIG}"
          test -f "$CONFIG_FILE" || (echo "ERROR: $CONFIG_FILE not found"; exit 1)
          make O=out ARCH=arm64 ${KERNEL_DEFCONFIG}
          # Force DEBUG_KERNEL=n after defconfig (EMBEDDED=y → EXPERT → DEBUG_KERNEL via select)
          sed -i 's/^CONFIG_DEBUG_KERNEL=y$/# CONFIG_DEBUG_KERNEL is not set/' out/.config
          echo
                    echo "=== Verifying safe tweaks are ENABLED ==="
                    # Check each config appropriately (some are boolean, some are numeric/choice)
                    for cfg in UCLAMP_BUCKETS_COUNT SCHED_THERMAL_PRESSURE ENERGY_MODEL \
                               CPU_FREQ_DEFAULT_GOV_SCHEDUTIL CPU_FREQ_GOV_PERFORMANCE \
                               ZRAM_DEF_COMP_ZSTD FRONTSWAP ZSWAP MQ_IOSCHED_KYBER \
                               TRANSPARENT_HUGEPAGE_MADVISE; do
                      case "$cfg" in
                        UCLAMP_BUCKETS_COUNT)
                          if grep -q "^CONFIG_${cfg}=" out/.config; then
                            echo "  OK    CONFIG_${cfg} is set"
                          else
                            echo "  MISS  CONFIG_${cfg} not set  (safe tweak missing)"
                          fi
                          ;;
                        ZSWAP|MQ_IOSCHED_KYBER|FRONTSWAP|ENERGY_MODEL|SCHED_THERMAL_PRESSURE|CPU_FREQ_DEFAULT_GOV_SCHEDUTIL|CPU_FREQ_GOV_PERFORMANCE|ZRAM_DEF_COMP_ZSTD|TRANSPARENT_HUGEPAGE_MADVISE)
                          if grep -q "^CONFIG_${cfg}=y" out/.config; then
                            echo "  OK    CONFIG_${cfg}=y"
                          else
                            echo "  MISS  CONFIG_${cfg}=y  (safe tweak not set)"
                          fi
                          ;;
                      esac
                    done
          echo
          echo "=== Boot-breakers that should be DISABLED ==="
          BREAK=0
          for cfg in DEBUG_KERNEL TRANSPARENT_HUGEPAGE_ALWAYS CPU_FREQ_GOV_ONDEMAND \
                     SCHED_WALT QCOM_CPUBOOST QCOM_CORE_CTL DRM_MSM_PREEMPT; do
            if grep -q "^CONFIG_${cfg}=y" out/.config; then
              echo "  FAIL  CONFIG_${cfg}=y  (boot-breaker IS set)"
              BREAK=1
            else
              echo "  OK    CONFIG_${cfg} not set"
            fi
          done
          if [ "$BREAK" = "1" ]; then
            echo
            echo "ERROR: boot-breaker config options are enabled. Aborting build."
            exit 1
          fi

      - name: Build kernel
        run: |
          set -e
          chmod +x scripts/build.sh
          ./scripts/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Download anykernel.zip
        run: |
          wget -q https://github.com/gyabii/kernel_samsung_sm8550-common/releases/download/anykernel/anykernel.zip

      - name: Package kernel
        run: |
          set -eux
          unzip -o anykernel.zip -d anykernel
          cp "${OUT_DIR}/arch/arm64/boot/Image.gz" anykernel/
          cp sm8550_ultra_perf_runtime.sh anykernel/ 2>/dev/null || true
          cp sm8550_perf_runtime.sh anykernel/ 2>/dev/null || true
          cp sm8550_benchmark_mode.sh anykernel/ 2>/dev/null || true
          cp sm8550_restore_normal.sh anykernel/ 2>/dev/null || true
          cp kernel_cmdline_perf.txt anykernel/ 2>/dev/null || true
          cd anykernel
          zip -r9 "../kernel-sm8550-perf-${{ github.sha }}.zip" . -x "*.git*" -x "README*" -x "*.zip"
          cd ..
          echo "KERNEL_ZIP=kernel-sm8550-perf-${{ github.sha }}.zip" >> $GITHUB_ENV

      - name: Upload kernel artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-sm8550-perf-${{ github.sha }}
          path: kernel-sm8550-perf-*.zip
          retention-days: 30

      - name: Create release
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: sm8550-perf-${{ github.run_number }}
          name: "SM8550 Max Performance (safe defconfig)"
          body: |
            # SM8550 Max Performance Build

            Built from branch `android13-5.15` with the fixed `sm8550_perf_defconfig`.

            ## Performance flags used (safe, no -ffast-math)

            - `-O3`, Thin LTO, `-march=armv9-a`
            - Loop unroll/peel, SLP vectorize, devirtualize
            - Clang 17 with BOLT support

            ## Safe defconfig tweaks (verified at build time)

            - UCLAMP_BUCKETS_COUNT, SCHED_THERMAL_PRESSURE, ENERGY_MODEL
            - SCHEDUTIL + PERFORMANCE governors
            - ZRAM/ZSWAP with ZSTD, FRONTSWAP
            - Kyber I/O scheduler
            - TRANSPARENT_HUGEPAGE_MADVISE (not always)

            ## Removed (caused boot failure)

            See commit `58925b367` on branch `fix/perf-boot-recovery`.
          files: kernel-sm8550-perf-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
