# ============================================================================
# SM8550 MAXIMUM PERFORMANCE TWEAKS (appended to gki_defconfig)
# Applied by Hermes agent. Last-wins over earlier entries in defconfig.
# NOTE: vendor-specific symbols (SCHED_WALT, QCOM_CPUBOOST, QCOM_CORE_CTL,
#       DRM_MSM_PREEMPT, RCU_BOOST_PRIO, RCU_NOCB_CPU_DEFAULT_ALL) do NOT exist
#       in this GKI *common* tree; they belong to the downstream device kernel.
#       They are exposed as runtime sysfs/property tweaks instead (see
#       scripts/sm8550_perf_runtime.sh).
# ============================================================================

# --- Scheduler / EAS / uclamp ---
CONFIG_UCLAMP_BUCKETS_COUNT=40
CONFIG_SCHED_THERMAL_PRESSURE=y
CONFIG_ENERGY_MODEL=y

# --- CPUFreq / governors ---
CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
CONFIG_CPU_FREQ_GOV_PERFORMANCE=y

# --- Thermal: performance-first (disable aggressive power allocator) ---
CONFIG_THERMAL_DEFAULT_GOV_USER_SPACE=y
# CONFIG_THERMAL_GOV_POWER_ALLOCATOR is not set
CONFIG_THERMAL_GOV_STEP_WISE=y
CONFIG_THERMAL_GOV_USER_SPACE=y

# --- Memory / zram / swap ---
CONFIG_ZRAM_DEF_COMP="zstd"
# CONFIG_ZRAM_DEF_COMP_LZO is not set
# CONFIG_ZRAM_DEF_COMP_LZ4 is not set
# CONFIG_ZRAM_DEF_COMP_LZORLE is not set
CONFIG_ZRAM_DEF_COMP_ZSTD=y
CONFIG_ZRAM_LRU_WRITEBACK_LIMIT=4096
CONFIG_ZRAM_WRITEBACK=y
CONFIG_FRONTSWAP=y
CONFIG_ZSWAP=y
CONFIG_ZSWAP_COMPRESSOR_DEFAULT="zstd"
CONFIG_ZSWAP_ZPOOL_DEFAULT="z3fold"

# --- I/O scheduler: UFS prefers none/kyber over BFQ ---
# CONFIG_IOSCHED_BFQ is not set
CONFIG_MQ_IOSCHED_KYBER=y

# --- RCU ---
CONFIG_RCU_BOOST_DELAY=100

# --- Transparent Hugepages: always ---
CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS=y
# CONFIG_TRANSPARENT_HUGEPAGE_MADVISE is not set

# --- Reduce scheduler debug/stat overhead ---
# CONFIG_SCHED_DEBUG is not set
# CONFIG_SCHEDSTATS is not set
