# SM8550 Maximum Performance - perfd (Performance Daemon) Configuration
# Place at: /vendor/etc/perfd/perfd.cfg or /system/etc/perfd/perfd.cfg
# This is the Qualcomm perf daemon config for SM8550 (Kalama/SM8550)

# =========================================================================
# GLOBAL SETTINGS
# =========================================================================
[global]
# Enable perfd
enable = true

# Log level: 0=error, 1=warn, 2=info, 3=debug
log_level = 1

# Polling interval (ms) - lower = more responsive, higher = less overhead
poll_interval_ms = 50

# =========================================================================
# CPU PERFORMANCE MODES
# =========================================================================
[cpu]
# Mode: performance | balanced | powersave | custom
mode = performance

# Core control
core_ctl = {
    # Big cluster (cpu4-7: 1x Cortex-X3 @ 3.2GHz + 3x Cortex-A715 @ 2.8GHz)
    cluster_big = {
        min_cpus = 1
        max_cpus = 4
        busy_up_threshold = 85
        busy_down_threshold = 35
        offline_delay_ms = 50
        boost_duration_ms = 200
        preferred_cpus = [4]  # Keep X3 core online
    }
    
    # Mid cluster (cpu1-3: 3x Cortex-A715 @ 2.8GHz) - if separate
    cluster_mid = {
        min_cpus = 1
        max_cpus = 3
        busy_up_threshold = 90
        busy_down_threshold = 40
        offline_delay_ms = 100
    }
    
    # Little cluster (cpu0: 2x Cortex-A510 @ 2.0GHz)
    cluster_little = {
        min_cpus = 2
        max_cpus = 4
        busy_up_threshold = 75
        busy_down_threshold = 30
        offline_delay_ms = 200
    }
}

# CPU Boost (input/launch/sustained)
boost = {
    # Input boost (touch)
    input = {
        enabled = true
        duration_ms = 200
        # Freq per CPU: X3=3187MHz, A715=2803MHz, A510=2016MHz
        # Use max non-turbo for sustained boost
        freq = [2016000, 2016000, 2016000, 2016000, 2803000, 2803000, 2803000, 3187000]
    }
    
    # Launch boost (app start)
    launch = {
        enabled = true
        duration_ms = 500
        freq = [2803000, 2803000, 2803000, 2803000, 3187000, 3187000, 3187000, 3187000]
    }
    
    # Sustained boost (gaming)
    sustained = {
        enabled = true
        # Keep big cores at max
        freq = [2016000, 2016000, 2016000, 2016000, 2803000, 2803000, 2803000, 3187000]
    }
}

# Frequency governors per cluster
governor = {
    cluster_big = "schedutil"
    cluster_mid = "schedutil"
    cluster_little = "schedutil"
    
    # schedutil tuning
    schedutil = {
        up_rate_limit_us = 5000
        down_rate_limit_us = 20000
        iowait_boost = true
    }
}

# =========================================================================
# GPU (Adreno 740)
# =========================================================================
[gpu]
mode = performance

# Clock control
clock = {
    max_freq = 900000000  # 900 MHz
    min_freq = 300000000
    boost_freq = 900000000
    force_clk_on = true
    force_bus_on = true
    force_rail_on = false
}

# Power levels (GX, MX, LX, etc.)
power_levels = {
    # Index: freq_hz, volt_uv
    0 = { freq = 900000000, volt = 900000 }   # Max
    1 = { freq = 750000000, volt = 800000 }
    2 = { freq = 600000000, volt = 700000 }
    3 = { freq = 450000000, volt = 600000 }
    4 = { freq = 300000000, volt = 500000 }
}

# Preemption
preemption = {
    enabled = true
    timeout_ms = 1
}

# Governor
governor = "performance"

# =========================================================================
# MEMORY / DDR
# =========================================================================
[ddr]
mode = performance

# Bandwidth scaling
bw_scaling = {
    enabled = true
    # DDR5-6400 on SM8550
    max_bw = 51200  # MB/s
    min_bw = 16000
    
    # Governor: performance | bw_hwmon | userspace
    governor = "performance"
}

# =========================================================================
# THERMAL
# =========================================================================
[thermal]
# Use userspace governor (perfd controls)
governor = "userspace"

# Thermal zones (SM8550 typical)
zones = {
    # CPU cluster zones
    cpu0-3 = {  # Little + Mid
        throttle_temp = 95000   # 95°C
        critical_temp = 105000  # 105°C
        hyst = 5000             # 5°C hysteresis
    }
    cpu4-7 = {  # Big
        throttle_temp = 95000
        critical_temp = 105000
        hyst = 5000
    }
    
    # GPU
    gpu = {
        throttle_temp = 90000
        critical_temp = 100000
        hyst = 5000
    }
    
    # DDR
    ddr = {
        throttle_temp = 85000
        critical_temp = 95000
        hyst = 5000
    }
    
    # Skin (touch)
    skin = {
        throttle_temp = 45000
        critical_temp = 50000
        hyst = 3000
    }
}

# Sustainable power (disable for max perf)
sustainable_power = {
    enabled = false
}

# =========================================================================
# I/O
# =========================================================================
[io]
# UFS scheduler
scheduler = "kyber"

# Read ahead
read_ahead_kb = 0

# =========================================================================
# POWER HAL HINTS
# =========================================================================
[power_hint]
# Power hint mappings for Android Power HAL
# These tell perfd what to do for each hint

hints = {
    # SUSTAINED_PERFORMANCE - gaming
    0 = {  # POWER_HINT_SUSTAINED_PERFORMANCE
        cpu = { mode = "sustained" }
        gpu = { mode = "performance" }
        ddr = { mode = "performance" }
        duration = 0  # indefinite
    }
    
    # LAUNCH - app launch
    1 = {  # POWER_HINT_LAUNCH
        cpu = { mode = "launch" }
        duration = 500
    }
    
    # INTERACTION - touch/scroll
    2 = {  # POWER_HINT_INTERACTION
        cpu = { mode = "input_boost" }
        duration = 200
    }
    
    # VIDEO_ENCODE
    3 = {  # POWER_HINT_VIDEO_ENCODE
        cpu = { mode = "balanced" }
        gpu = { mode = "balanced" }
    }
    
    # VIDEO_DECODE
    4 = {  # POWER_HINT_VIDEO_DECODE
        cpu = { mode = "balanced" }
        gpu = { mode = "balanced" }
    }
    
    # VR_MODE
    5 = {  # POWER_HINT_VR_MODE
        cpu = { mode = "sustained" }
        gpu = { mode = "performance" }
        ddr = { mode = "performance" }
        duration = 0
    }
}

# =========================================================================
# ADVANCED: EAS ENERGY MODEL OVERRIDES
# =========================================================================
[eas]
# Override energy model for max perf (make big cores look more efficient)
# Format: cpu:capacity:power_coeff
energy_model = {
    cpu0 = { capacity = 384, power = 100 }   # A510
    cpu1 = { capacity = 512, power = 150 }   # A715
    cpu2 = { capacity = 512, power = 150 }
    cpu3 = { capacity = 512, power = 150 }
    cpu4 = { capacity = 768, power = 200 }   # A715 (mid)
    cpu5 = { capacity = 768, power = 200 }
    cpu6 = { capacity = 768, power = 200 }
    cpu7 = { capacity = 1024, power = 250 }  # X3 (prime)
}

# =========================================================================
# SCENARIOS (auto-applied based on foreground app)
# =========================================================================
[scenarios]
# Package-specific tuning
com.mobile.legends = { cpu = "sustained", gpu = "performance", ddr = "performance" }
com.pubg.imobile = { cpu = "sustained", gpu = "performance", ddr = "performance" }
com.callofduty.warzone = { cpu = "sustained", gpu = "performance", ddr = "performance" }
com.genshin.impact = { cpu = "sustained", gpu = "performance", ddr = "performance" }
com.miHoYo.GenshinImpact = { cpu = "sustained", gpu = "performance", ddr = "performance" }

# Benchmark apps
com.androbench = { cpu = "sustained", gpu = "performance" }
com.antutu.benchmark = { cpu = "sustained", gpu = "performance" }
com.geekbench = { cpu = "sustained", gpu = "performance" }