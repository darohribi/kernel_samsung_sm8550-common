# SM8550 MSPv2 - sysctl tuning
# Measured values, not extreme. Applied on top of vendor defaults.

# =========================================================================
# VM / memory (less aggressive than v1)
# =========================================================================
# v1 used swappiness=100, vfs_cache_pressure=500 which thrashes pages
# under sustained memory pressure. v2 uses measured defaults.
vm.swappiness = 60
vm.vfs_cache_pressure = 100
vm.dirty_ratio = 20
vm.dirty_background_ratio = 10
vm.page-cluster = 3
vm.compact_unevictable_allowed = 0
vm.stat_interval = 10

# =========================================================================
# Scheduler
# =========================================================================
# Per-cgroup UCLAMP is configured in runtime/common.sh, not here.
# These are global scheduler tunables only.
kernel.sched_child_runs_first = 0
kernel.sched_latency_ns = 4000000
kernel.sched_min_granularity_ns = 500000
kernel.sched_wakeup_granularity_ns = 1000000
kernel.sched_migration_cost_ns = 500000
kernel.sched_tunable_scaling = 1

# =========================================================================
# Latency / responsiveness (interactivity)
# =========================================================================
# These are boot-time defaults. The gaming profile will override per-cgroup.
kernel.sched_util_clamp_min = 128
kernel.sched_util_clamp_max = 1024
kernel.sched_util_clamp_min_rt = 512

# =========================================================================
# Network (measured, not maxed)
# =========================================================================
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_fastopen = 3

# =========================================================================
# Kernel
# =========================================================================
kernel.io_delay_type = 1
kernel.randomize_va_space = 2
