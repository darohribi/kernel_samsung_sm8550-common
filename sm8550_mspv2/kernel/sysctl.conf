# SM8550 MSPv2 - sysctl tuning
# Boot-time tunables applied on top of vendor defaults.
#
# Philosophy: minimal tuning, measured values only. The runtime scripts
# handle per-cgroup UCLAMP, schedutil rate limits, and thermal response.
# These sysctls cover VM, scheduler globals, and I/O that benefit from
# a single tunable value across all cgroups.

# =========================================================================
# VM / memory
# =========================================================================
# v1: swappiness=100, vfs_cache_pressure=500, dirty_ratio=20, page-cluster=3
# v2: baseline values that don't aggressively reclaim pages.
# page-cluster=0 disables read-ahead grouping (each page fault fetches exactly
# what is needed — better for interactive workloads, worse for bulk reads).
vm.swappiness = 60
vm.vfs_cache_pressure = 100
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.page-cluster = 0
vm.compact_unevictable_allowed = 1
vm.stat_interval = 10

# =========================================================================
# Scheduler (global, not per-cgroup)
# =========================================================================
# Per-cgroup UCLAMP is handled in runtime/common.sh via cgroup files.
# These tune the global scheduler behavior.
kernel.sched_child_runs_first = 0
kernel.sched_latency_ns = 6000000
kernel.sched_min_granularity_ns = 600000
kernel.sched_wakeup_granularity_ns = 1000000
kernel.sched_migration_cost_ns = 500000

# =========================================================================
# I/O (filesystem / block layer)
# =========================================================================
# These help reduce stall latency from background writeback.
vm.dirty_writeback_centisecs = 500
vm.dirty_expire_centisecs = 30
