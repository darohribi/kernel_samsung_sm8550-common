# SM8550 Maximum Performance - thermald Configuration
# Place at: /vendor/etc/thermald.conf or /system/etc/thermald.conf
# Thermal daemon config for SM8550 - maximum performance, minimal throttling

# =========================================================================
# GLOBAL SETTINGS
# =========================================================================
<Configuration>
  <Version>2.0</Version>
  <Platform>
    <Name>SM8550</Name>
    <ThermalSensors>
      <!-- CPU Temperature Sensors -->
      <Sensor id="cpu0-3-temp" type="cpu" zone="0" critical="105000" passive="95000" active="90000" />
      <Sensor id="cpu4-7-temp" type="cpu" zone="1" critical="105000" passive="95000" active="90000" />
      
      <!-- GPU Temperature Sensor -->
      <Sensor id="gpu-temp" type="gpu" zone="2" critical="100000" passive="90000" active="85000" />
      
      <!-- DDR Temperature Sensor -->
      <Sensor id="ddr-temp" type="memory" zone="3" critical="95000" passive="85000" active="80000" />
      
      <!-- Skin Temperature Sensor -->
      <Sensor id="skin-temp" type="skin" zone="4" critical="50000" passive="45000" active="43000" />
      
      <!-- Battery Temperature Sensor -->
      <Sensor id="battery-temp" type="battery" zone="5" critical="55000" passive="50000" active="48000" />
      
      <!-- PMIC Temperature Sensor -->
      <Sensor id="pmic-temp" type="pmic" zone="6" critical="110000" passive="100000" active="95000" />
    </ThermalSensors>
  </Platform>

  <!-- =========================================================================
       THERMAL ZONES
       Each zone defines cooling actions at different temperature thresholds
       ========================================================================= -->
  
  <!-- Zone 0: Little + Mid CPU Cluster (cpu0-3) -->
  <ThermalZone id="cpu0-3-zone" type="cpu">
    <TripPoints>
      <!-- Passive cooling (software) at 95°C -->
      <TripPoint id="cpu0-3-passive" type="passive" temperature="95000" hysteresis="5000">
        <CoolingAction>
          <Type>cpu_frequency_limit</Type>
          <Target>cpu0-3</Target>
          <Value>2016000</Value>  <!-- Cap at max non-turbo A715/A510 -->
        </CoolingAction>
      </TripPoint>
      
      <!-- Active cooling (fan - not on phones) -->
      <TripPoint id="cpu0-3-active" type="active" temperature="90000" hysteresis="5000">
        <CoolingAction>
          <Type>notify</Type>
          <Target>perfd</Target>
          <Value>thermal_pressure=0.3</Value>
        </CoolingAction>
      </TripPoint>
      
      <!-- Critical: emergency shutdown at 105°C -->
      <TripPoint id="cpu0-3-critical" type="critical" temperature="105000" hysteresis="2000">
        <CoolingAction>
          <Type>shutdown</Type>
        </CoolingAction>
      </TripPoint>
    </TripPoints>
  </ThermalZone>

  <!-- Zone 1: Big CPU Cluster (cpu4-7) -->
  <ThermalZone id="cpu4-7-zone" type="cpu">
    <TripPoints>
      <TripPoint id="cpu4-7-passive" type="passive" temperature="95000" hysteresis="5000">
        <CoolingAction>
          <Type>cpu_frequency_limit</Type>
          <Target>cpu4-7</Target>
          <Value>2803000</Value>  <!-- Cap at max non-turbo X3/A715 -->
        </CoolingAction>
      </TripPoint>
      
      <TripPoint id="cpu4-7-active" type="active" temperature="90000" hysteresis="5000">
        <CoolingAction>
          <Type>notify</Type>
          <Target>perfd</Target>
          <Value>thermal_pressure=0.3</Value>
        </CoolingAction>
      </TripPoint>
      
      <TripPoint id="cpu4-7-critical" type="critical" temperature="105000" hysteresis="2000">
        <CoolingAction>
          <Type>shutdown</Type>
        </CoolingAction>
      </TripPoint>
    </TripPoints>
  </ThermalZone>

  <!-- Zone 2: GPU (Adreno 740) -->
  <ThermalZone id="gpu-zone" type="gpu">
    <TripPoints>
      <TripPoint id="gpu-passive" type="passive" temperature="90000" hysteresis="5000">
        <CoolingAction>
          <Type>gpu_frequency_limit</Type>
          <Target>gpu</Target>
          <Value>750000000</Value>  <!-- Cap at 750 MHz -->
        </CoolingAction>
      </TripPoint>
      
      <TripPoint id="gpu-active" type="active" temperature="85000" hysteresis="5000">
        <CoolingAction>
          <Type>notify</Type>
          <Target>perfd</Target>
          <Value>thermal_pressure=0.2</Value>
        </CoolingAction>
      </TripPoint>
      
      <TripPoint id="gpu-critical" type="critical" temperature="100000" hysteresis="2000">
        <CoolingAction>
          <Type>shutdown</Type>
        </CoolingAction>
      </TripPoint>
    </TripPoints>
  </ThermalZone>

  <!-- Zone 3: DDR Memory -->
  <ThermalZone id="ddr-zone" type="memory">
    <TripPoints>
      <TripPoint id="ddr-passive" type="passive" temperature="85000" hysteresis="5000">
        <CoolingAction>
          <Type>ddr_bandwidth_limit</Type>
          <Target>ddr</Target>
          <Value>32000</Value>  <!-- Limit to 32 GB/s -->
        </CoolingAction>
      </TripPoint>
      
      <TripPoint id="ddr-critical" type="critical" temperature="95000" hysteresis="2000">
        <CoolingAction>
          <Type>shutdown</Type>
        </CoolingAction>
      </TripPoint>
    </TripPoints>
  </ThermalZone>

  <!-- Zone 4: Skin (Touch) Temperature -->
  <ThermalZone id="skin-zone" type="skin">
    <TripPoints>
      <TripPoint id="skin-passive" type="passive" temperature="45000" hysteresis="3000">
        <CoolingAction>
          <Type>cpu_frequency_limit</Type>
          <Target>all</Target>
          <Value>1500000</Value>  <!-- Aggressive cap for user comfort -->
        </CoolingAction>
        <CoolingAction>
          <Type>gpu_frequency_limit</Type>
          <Target>gpu</Target>
          <Value>450000000</Value>
        </CoolingAction>
      </TripPoint>
      
      <TripPoint id="skin-critical" type="critical" temperature="50000" hysteresis="2000">
        <CoolingAction>
          <Type>shutdown</Type>
        </CoolingAction>
      </TripPoint>
    </TripPoints>
  </ThermalZone>

  <!-- Zone 5: Battery -->
  <ThermalZone id="battery-zone" type="battery">
    <TripPoints>
      <TripPoint id="battery-passive" type="passive" temperature="50000" hysteresis="3000">
        <CoolingAction>
          <Type>charging_current_limit</Type>
          <Target>charger</Target>
          <Value>1000000</Value>  <!-- Limit to 1A -->
        </CoolingAction>
        <CoolingAction>
          <Type>cpu_frequency_limit</Type>
          <Target>all</Target>
          <Value>2000000</Value>
        </CoolingAction>
      </TripPoint>
      
      <TripPoint id="battery-critical" type="critical" temperature="55000" hysteresis="2000">
        <CoolingAction>
          <Type>shutdown</Type>
        </CoolingAction>
      </TripPoint>
    </TripPoints>
  </ThermalZone>

  <!-- Zone 6: PMIC -->
  <ThermalZone id="pmic-zone" type="pmic">
    <TripPoints>
      <TripPoint id="pmic-passive" type="passive" temperature="100000" hysteresis="5000">
        <CoolingAction>
          <Type>notify</Type>
          <Target>perfd</Target>
          <Value>thermal_pressure=0.5</Value>
        </CoolingAction>
      </TripPoint>
      
      <TripPoint id="pmic-critical" type="critical" temperature="110000" hysteresis="2000">
        <CoolingAction>
          <Type>shutdown</Type>
        </CoolingAction>
      </TripPoint>
    </TripPoints>
  </ThermalZone>

  <!-- =========================================================================
       COOLING DEVICES
       Define available cooling devices and their capabilities
       ========================================================================= -->
  
  <CoolingDevices>
    <!-- CPU Frequency Cooling -->
    <CoolingDevice id="cpu0-3-freq" type="cpu_frequency">
      <CPUs>0,1,2,3</CPUs>
      <MinFreq>300000</MinFreq>
      <MaxFreq>2803000</MaxFreq>
      <StepFreq>100000</StepFreq>
    </CoolingDevice>
    
    <CoolingDevice id="cpu4-7-freq" type="cpu_frequency">
      <CPUs>4,5,6,7</CPUs>
      <MinFreq>300000</MinFreq>
      <MaxFreq>3187000</MaxFreq>
      <StepFreq>100000</StepFreq>
    </CoolingDevice>
    
    <!-- GPU Frequency Cooling -->
    <CoolingDevice id="gpu-freq" type="gpu_frequency">
      <MinFreq>300000000</MinFreq>
      <MaxFreq>900000000</MaxFreq>
      <StepFreq>50000000</StepFreq>
    </CoolingDevice>
    
    <!-- DDR Bandwidth Cooling -->
    <CoolingDevice id="ddr-bw" type="ddr_bandwidth">
      <MinBW>8000</MinBW>
      <MaxBW>51200</MaxBW>
      <StepBW>4000</StepBW>
    </CoolingDevice>
    
    <!-- Charging Current Cooling -->
    <CoolingDevice id="charging" type="charging_current">
      <MinCurrent>500000</MinCurrent>
      <MaxCurrent>5000000</MaxCurrent>
      <StepCurrent>500000</StepCurrent>
    </CoolingDevice>
  </CoolingDevices>

  <!-- =========================================================================
       THERMAL POLICIES
       Define when and how to apply cooling
       ========================================================================= -->
  
  <ThermalPolicies>
    <!-- Default policy: minimal intervention until critical -->
    <Policy id="default" priority="100">
      <Conditions>
        <Condition sensor="cpu0-3-temp" operator=">=" value="95000" />
        <Condition sensor="cpu4-7-temp" operator=">=" value="95000" />
        <Condition sensor="gpu-temp" operator=">=" value="90000" />
        <Condition sensor="ddr-temp" operator=">=" value="85000" />
        <Condition sensor="skin-temp" operator=">=" value="45000" />
      </Conditions>
      <Actions>
        <Action device="cpu0-3-freq" value="2016000" />
        <Action device="cpu4-7-freq" value="2803000" />
        <Action device="gpu-freq" value="750000000" />
        <Action device="ddr-bw" value="32000" />
      </Actions>
    </Policy>

    <!-- Gaming policy: higher thresholds, less throttling -->
    <Policy id="gaming" priority="200">
      <Conditions>
        <Condition sensor="cpu0-3-temp" operator=">=" value="98000" />
        <Condition sensor="cpu4-7-temp" operator=">=" value="98000" />
        <Condition sensor="gpu-temp" operator=">=" value="92000" />
        <Condition sensor="skin-temp" operator=">=" value="47000" />
      </Conditions>
      <Actions>
        <Action device="cpu0-3-freq" value="2016000" />
        <Action device="cpu4-7-freq" value="2803000" />
        <Action device="gpu-freq" value="800000000" />
      </Actions>
    </Policy>

    <!-- Benchmark policy: maximum thresholds -->
    <Policy id="benchmark" priority="300">
      <Conditions>
        <Condition sensor="cpu0-3-temp" operator=">=" value="100000" />
        <Condition sensor="cpu4-7-temp" operator=">=" value="100000" />
        <Condition sensor="gpu-temp" operator=">=" value="95000" />
        <Condition sensor="skin-temp" operator=">=" value="48000" />
      </Conditions>
      <Actions>
        <Action device="cpu0-3-freq" value="2803000" />
        <Action device="cpu4-7-freq" value="3187000" />
        <Action device="gpu-freq" value="900000000" />
      </Actions>
    </Policy>

    <!-- Emergency policy: safety first -->
    <Policy id="emergency" priority="1000">
      <Conditions>
        <Condition sensor="any" operator=">=" value="105000" />
      </Conditions>
      <Actions>
        <Action device="cpu0-3-freq" value="300000" />
        <Action device="cpu4-7-freq" value="300000" />
        <Action device="gpu-freq" value="300000000" />
        <Action device="charging" value="0" />
      </Actions>
    </Policy>
  </ThermalPolicies>

  <!-- =========================================================================
       THERMAL MANAGEMENT
       ========================================================================= -->
  <ThermalManagement>
    <!-- Polling interval (ms) -->
    <PollInterval>1000</PollInterval>
    
    <!-- Use userspace governor (perfd controls) -->
    <Governor>userspace</Governor>
    
    <!-- Logging -->
    <LogLevel>1</LogLevel>
    <LogFile>/dev/log/thermald</LogFile>
    
    <!-- Emergency shutdown grace period (ms) -->
    <ShutdownGracePeriod>5000</ShutdownGracePeriod>
  </ThermalManagement>
</Configuration>